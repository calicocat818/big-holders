name: 每日週線突破掃描

on:
  schedule:
    - cron: '40 8 * * 1-5'
    - cron: '40 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓行情並掃描
        run: node scripts/breakout.mjs
      - name: 存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "週線突破掃描 $(date +%F)"
          git pull --rebase
          git push
